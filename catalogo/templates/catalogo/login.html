{% extends "catalogo/base.html" %}
{% block title %}Iniciar sesión | MotorHaus{% endblock %}
{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card border-0 shadow">
                <div class="card-body p-4 p-md-5">
                    <span class="badge text-bg-warning mb-3">MOTORHAUS</span>
                    <h1 class="h2 fw-bold">Iniciar sesión</h1>
                    <p class="text-secondary mb-4">Accede para publicar y administrar vehículos.</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label" for="username">Nombre de usuario</label>
                            <input class="form-control" id="username" name="username" autocomplete="username" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="password">Contraseña</label>
                            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
                        </div>
                        <button class="btn btn-warning fw-semibold w-100" type="submit">Entrar</button>
                    </form>
                    <p class="text-center text-secondary mt-4 mb-0">¿Nuevo en MotorHaus? <a href="{% url 'registro' %}">Crear cuenta</a></p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
