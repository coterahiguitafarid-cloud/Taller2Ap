{% extends "store/base.html" %}
{% block title %}{{ title }} | TcnoCO{% endblock %}
{% block content %}
<section class="form-panel">
  <h1 class="page-title">{{ title }}</h1>
  <form method="post" class="panel panel-body">
    {% csrf_token %}
    {{ form.as_p }}
    {% if form.image_url.value %}
      <img class="product-image-preview" src="{{ form.image_url.value }}" alt="Vista previa de la imagen del producto">
    {% endif %}
    <div class="button-row">
      <button class="button button-primary" type="submit">Guardar</button>
      <a class="button button-secondary" href="{% url 'store:admin_products' %}">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
