{% extends "store/base.html" %}
{% block title %}Ingresar | TcnoCO{% endblock %}
{% block content %}
<section class="form-panel form-panel-narrow">
  <h1 class="page-title">Iniciar sesión</h1>
  <form method="post" class="panel panel-body">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button button-primary" type="submit">Ingresar</button>
  </form>
  <p>¿Aún no tienes cuenta? <a href="{% url 'store:register' %}">Regístrate</a>.</p>
</section>
{% endblock %}
